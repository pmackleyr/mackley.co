<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MACKLEY</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons (dark/light) -->
  <link rel="icon" href="bg/icon_dark.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="bg/icon_light.png" media="(prefers-color-scheme: dark)" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* ===== HERO BACKGROUND ===== */
    .hero-bg {
      position: fixed;
      inset: 0;
      background: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* ===== HEADER ===== */
    .site-header {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.5em;
      font-size: 12px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .site-icon {
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    /* ===== CENTER TEXT ===== */
    .center-text {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 1;
      font-size: clamp(18px, 4vw, 32px);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
    }

    .center-action {
      pointer-events: auto;
      cursor: pointer;
      color: #fff;
      user-select: none;
    }

    /* ===== FOOTER ===== */
    .footer-shell {
      position: fixed;
      inset-inline: 0;
      bottom: 0;
      z-index: 2;
      pointer-events: none;
    }

    .footer-gradient {
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0));
    }

    .footer {
      position: absolute;
      left: 0; right: 0; bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.88);
      pointer-events: auto;
    }

    .footer-top {
      display: flex;
      align-items: center;
      gap: 18px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .footer-logo { height: 14px; }

    .footer-link {
      color: inherit;
      text-decoration: none;
    }
    .footer-link:hover { text-decoration: underline; }

    .footer-meta {
      font-size: 10px;
      color: rgba(255,255,255,0.55);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 600px) {
      .footer-top {
        flex-direction: column;
        gap: 6px;
      }
      .footer-gradient {
        height: 160px;
      }
    }
  </style>
</head>

<body>
  <div class="hero-bg" id="heroBg"></div>

  <header class="site-header">
    <img src="bg/icon_light.png" alt="" class="site-icon" id="siteIcon" />
    <span>MACKLEY</span>
  </header>

  <main class="center-text">
    <span class="center-action" id="breatheAction" role="button" tabindex="0">1. BREATHE</span>
    <span class="center-action" id="deeperAction" role="button" tabindex="0">2. DEEPER</span>
  </main>

  <div class="footer-shell">
    <div class="footer-gradient"></div>
    <footer class="footer">
      <div class="footer-top">
        <img src="images/logo_light.png" alt="MACKLEY" class="footer-logo" />
        <a href="/neti-pot" class="footer-link" id="footerProduct">THE ORIGINAL NETI POT</a>
        <span>•</span>
        <a href="/contact" class="footer-link">CONTACT</a>
      </div>
      <div class="footer-meta">
        <span>© 2025 Mackley</span>
        <a href="/legal" class="footer-link">Legal</a>
      </div>
    </footer>
  </div>

  <script>
    const heroBg = document.getElementById("heroBg");
    const breatheAction = document.getElementById("breatheAction");
    const deeperAction = document.getElementById("deeperAction");
    const siteIcon = document.getElementById("siteIcon");

    const iconLight = new Image();
    iconLight.src = "bg/icon_light.png";
    const iconDark = new Image();
    iconDark.src = "bg/icon_dark.png";

    const gifOptions = [
      { src: "bg/diver.gif", isLight: false },
      { src: "bg/fighter.gif", isLight: false },
      { src: "bg/surfer.gif", isLight: true },
      { src: "bg/yoga.gif", isLight: true }
    ];

    let lastGifIndex = -1;

    function pickRandomGif() {
      if (gifOptions.length === 1) {
        lastGifIndex = 0;
        return gifOptions[0];
      }
      let nextIndex = lastGifIndex;
      while (nextIndex === lastGifIndex) {
        nextIndex = Math.floor(Math.random() * gifOptions.length);
      }
      lastGifIndex = nextIndex;
      return gifOptions[nextIndex];
    }

    function setBackground() {
      const selection = pickRandomGif();
      heroBg.style.backgroundImage = `url('${selection.src}')`;
      siteIcon.src = selection.isLight ? iconDark.src : iconLight.src;
    }

    function resetBackground() {
      heroBg.style.backgroundImage = "none";
      siteIcon.src = iconLight.src;
    }

    function activate(actionElement, color) {
      actionElement.style.color = color;
      setBackground();
    }

    function deactivate(actionElement) {
      actionElement.style.color = "#fff";
      resetBackground();
    }

    const hoverCapable = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    if (hoverCapable) {
      breatheAction.addEventListener("mouseenter", () => activate(breatheAction, "#0a84ff"));
      breatheAction.addEventListener("mouseleave", () => deactivate(breatheAction));
      deeperAction.addEventListener("mouseenter", () => activate(deeperAction, "#ff9ad5"));
      deeperAction.addEventListener("mouseleave", () => deactivate(deeperAction));
    } else {
      const handleTouchStart = (event, actionElement, color) => {
        event.preventDefault();
        activate(actionElement, color);
      };

      const handleTouchEnd = (event, actionElement) => {
        event.preventDefault();
        deactivate(actionElement);
      };

      breatheAction.addEventListener("touchstart", event => handleTouchStart(event, breatheAction, "#0a84ff"), { passive: false });
      breatheAction.addEventListener("touchend", event => handleTouchEnd(event, breatheAction), { passive: false });
      breatheAction.addEventListener("touchcancel", event => handleTouchEnd(event, breatheAction), { passive: false });

      deeperAction.addEventListener("touchstart", event => handleTouchStart(event, deeperAction, "#ff9ad5"), { passive: false });
      deeperAction.addEventListener("touchend", event => handleTouchEnd(event, deeperAction), { passive: false });
      deeperAction.addEventListener("touchcancel", event => handleTouchEnd(event, deeperAction), { passive: false });
    }
  </script>

</body>
</html>
