<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MACKLEY — Original Neti Pot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons (dark/light) -->
  <link rel="icon" href="images/icon_dark.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="images/icon_light.png" media="(prefers-color-scheme: dark)" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    /* ===== HERO BACKGROUND ===== */
    .hero-bg {
      position: fixed;
      inset: 0;
      background: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.7s ease, filter 0.7s ease;
      z-index: 0;
    }
    .hero-bg.show {
      opacity: 1;
      filter: brightness(0.95);
    }

    /* ===== CENTERED DOT / INFINITY ===== */
    .hero-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }

    .pulse-wrapper {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .pulse {
      width: min(72px, 18vw);
      height: min(72px, 18vw);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: box-shadow 0.35s ease,
                  background-color 0.35s ease,
                  border-color 0.35s ease,
                  transform 0.35s ease;
      background-color: transparent;
      backdrop-filter: blur(4px);
      position: relative;
    }

    .pulse-inner-dot,
    .pulse-inner-symbol {
      font-size: 18px;
      line-height: 1;
      transition: color 0.3s ease,
                  opacity 0.3s ease,
                  transform 0.3s ease;
    }

    /* Base: white dot */
    .pulse-inner-dot { color: #fff; }

    /* Hover: black infinity (hidden by default) */
    .pulse-inner-symbol {
      position: absolute;
      color: #000;
      opacity: 0;
      transform: scale(0.9);
    }

    .pulse-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    /* Hover transitions */
    .pulse-wrapper:hover .pulse {
      background: #fff;
      border-color: #fff;
      box-shadow: 0 0 24px rgba(0,0,0,0.75);
      transform: scale(1.02);
    }
    .pulse-wrapper:hover .pulse-inner-dot {
      opacity: 0;
      transform: scale(0.7);
    }
    .pulse-wrapper:hover .pulse-inner-symbol {
      opacity: 1;
      transform: scale(1);
    }
    .pulse-wrapper:hover .pulse-label {
      color: #000;
    }

    /* ===== FOOTER ===== */
    .footer-shell {
      position: fixed;
      inset-inline: 0;
      bottom: 0;
      z-index: 2;
      pointer-events: none;
    }

    .footer-gradient {
      width: 100%;
      height: 120px;
      background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0));
    }

    .footer {
      position: absolute;
      left: 0; right: 0; bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.88);
      pointer-events: auto;
    }

    .footer-top {
      display: flex;
      align-items: center;
      gap: 18px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .footer-logo { height: 14px; }

    .footer-link {
      color: inherit;
      text-decoration: none;
    }
    .footer-link:hover { text-decoration: underline; }

    .footer-meta {
      font-size: 10px;
      color: rgba(255,255,255,0.55);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 600px) {
      .footer-top {
        flex-direction: column;
        gap: 6px;
      }
      .footer-gradient {
        height: 160px;
      }
    }
  </style>
</head>

<body>
  <div class="hero-bg" id="heroBg"></div>

  <main class="hero-overlay">
    <div class="pulse-wrapper" id="pulseWrapper">
      <button class="pulse" id="pulseButton" aria-label="Breathe">
        <span class="pulse-inner-dot">●</span>
        <span class="pulse-inner-symbol">∞</span>
      </button>
      <a href="#" id="pulseLabelLink" class="pulse-label">Breathe</a>
    </div>
  </main>

  <div class="footer-shell">
    <div class="footer-gradient"></div>
    <footer class="footer">
      <div class="footer-top">
        <img src="images/logo_light.png" alt="MACKLEY" class="footer-logo" />
        <a href="/neti-pot" class="footer-link" id="footerProduct">THE ORIGINAL NETI POT</a>
        <span>•</span>
        <a href="/contact" class="footer-link">CONTACT</a>
      </div>
      <div class="footer-meta">
        <span>© 2025 Mackley</span>
        <a href="/legal" class="footer-link">Legal</a>
      </div>
    </footer>
  </div>

  <script>
    const heroBg = document.getElementById("heroBg");
    const pulseWrapper = document.getElementById("pulseWrapper");
    const pulseButton = document.getElementById("pulseButton");
    const pulseLabel = document.getElementById("pulseLabelLink");
    const footerProduct = document.getElementById("footerProduct");

    const PRODUCT_URL = "/neti-pot";

    const images = [
      "images/fight.png",
      "images/run.png",
      "images/dive.png",
      "images/surf.png",
      "images/meditate.png"
    ];

    function randomImage() {
      return images[Math.floor(Math.random() * images.length)];
    }

    pulseWrapper.addEventListener("mouseenter", () => {
      heroBg.style.backgroundImage = `url('${randomImage()}')`;
      heroBg.classList.add("show");
      pulseLabel.textContent = "Potential";
      pulseButton.setAttribute("aria-label", "Potential");
    });

    pulseWrapper.addEventListener("mouseleave", () => {
      heroBg.classList.remove("show");
      pulseLabel.textContent = "Breathe";
      pulseButton.setAttribute("aria-label", "Breathe");
    });

    function goToProduct() {
      window.location.href = PRODUCT_URL;
    }

    pulseButton.addEventListener("click", goToProduct);
    pulseLabel.addEventListener("click", e => { e.preventDefault(); goToProduct(); });
    footerProduct.addEventListener("click", e => { e.preventDefault(); goToProduct(); });
  </script>

</body>
</html>
