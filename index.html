<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mackley — Breathe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons -->
  <link rel="icon" href="images/icon_dark.png" />
  <link rel="icon" href="images/icon_dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="images/icon_light.png" media="(prefers-color-scheme: light)" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --circle-size: clamp(60px, 10vw, 80px);
      --circle-border: 1.5px;
      --bg-color: #000000;
      --text-color: #ffffff;
      --muted: #9aa3bb;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
    }

    /* === BACKGROUND LAYER === */

    .hero {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
      z-index: 0;
    }

    .hero.show {
      opacity: 1;
    }

    /* === MAIN / CTA === */

    .main {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 80px; /* bottom space for footer */
      z-index: 1;
      text-align: center;
    }

    .cta-wrapper {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .cta {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: inherit;
      font: inherit;
      outline: none;
    }

    .cta-circle {
      width: var(--circle-size);
      height: var(--circle-size);
      border-radius: 999px;
      border: var(--circle-border) solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.9);
      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease,
        background-color 0.25s ease;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .cta-symbol {
      font-size: 22px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.75);
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .cta-label {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Hover / focus visual lift */
    .cta.hovering .cta-circle,
    .cta:focus-visible .cta-circle {
      border-color: #ffffff;
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.6);
      transform: scale(1.05);
      background-color: rgba(0, 0, 0, 0.2);
    }

    .cta.hovering .cta-symbol,
    .cta:focus-visible .cta-symbol {
      color: #ffffff;
      transform: scale(1.05);
    }

    /* === FOOTER === */

    .footer {
      position: relative;
      z-index: 1;
      padding: 12px 20px 18px;
      color: #ffffff;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .footer-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-logo {
      height: 18px;
      width: auto;
      display: block;
    }

    .footer-nav {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 10px;
    }

    .footer-link {
      color: #ffffff;
      text-decoration: none;
    }

    .footer-link:hover {
      text-decoration: underline;
    }

    .footer-dot {
      opacity: 0.6;
    }

    .footer-bottom {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
    }

    .footer-legal {
      color: var(--muted);
      text-decoration: none;
    }

    .footer-legal:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .footer-top {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <!-- Background layer -->
  <div class="hero" id="hero"></div>

  <!-- Main content -->
  <main class="main">
    <div class="cta-wrapper">
      <button class="cta" id="cta" aria-label="Breathe">
        <div class="cta-circle">
          <span class="cta-symbol" id="ctaSymbol">●</span>
        </div>
        <span class="cta-label" id="ctaLabel">breathe</span>
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-top">
      <img src="images/logo_light.png" alt="Mackley" class="footer-logo" />

      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="product.html" class="footer-link">The Original Neti Pot</a>
        <span class="footer-dot">•</span>
        <a href="contact.html" class="footer-link">Contact</a>
      </nav>
    </div>

    <div class="footer-bottom">
      <span>© 2025 Mackley</span>
      <a href="legal.html" class="footer-legal">Legal</a>
    </div>
  </footer>

  <script>
    // Background images (local paths)
    const heroImages = [
      "images/fight.png",
      "images/run.png",
      "images/dive.png",
      "images/surf.png"
    ];

    const heroEl = document.getElementById("hero");
    const cta = document.getElementById("cta");
    const ctaSymbol = document.getElementById("ctaSymbol");
    const ctaLabel = document.getElementById("ctaLabel");

    const PRODUCT_URL = "product.html"; // adjust to your real product page

    let lastImageIndex = -1;

    function pickRandomImage() {
      if (heroImages.length === 0) return null;
      let idx = Math.floor(Math.random() * heroImages.length);
      // avoid repeating the same image twice in a row, if possible
      if (heroImages.length > 1) {
        while (idx === lastImageIndex) {
          idx = Math.floor(Math.random() * heroImages.length);
        }
      }
      lastImageIndex = idx;
      return heroImages[idx];
    }

    function showRandomBackground() {
      const src = pickRandomImage();
      if (!src) return;
      heroEl.style.backgroundImage = `url("${src}")`;
      heroEl.classList.add("show");
    }

    function hideBackground() {
      heroEl.classList.remove("show");
    }

    // Hover: change ● breathe → ∞ potential and show random background
    cta.addEventListener("mouseenter", () => {
      cta.classList.add("hovering");
      ctaSymbol.textContent = "∞";
      ctaLabel.textContent = "potential";
      showRandomBackground();
    });

    // Leave: revert to base state and black background
    cta.addEventListener("mouseleave", () => {
      cta.classList.remove("hovering");
      ctaSymbol.textContent = "●";
      ctaLabel.textContent = "breathe";
      hideBackground();
    });

    // Tap / click: go to product page
    cta.addEventListener("click", (event) => {
      event.preventDefault();
      window.location.href = PRODUCT_URL;
    });

    // Also make the label itself act like a link for keyboard users
    ctaLabel.addEventListener("click", (event) => {
      event.preventDefault();
      window.location.href = PRODUCT_URL;
    });
  </script>
</body>
</html>
