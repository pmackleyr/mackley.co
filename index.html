<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MACKLEY</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bg-layer" aria-hidden="true"></div>

  <header class="site-header" aria-label="Site">
    <div class="site-title">MACKLEY</div>
  </header>

  <main class="narrative" id="narrative" aria-label="Narrative">
    <div class="snap-spacer" aria-hidden="true"></div>
    <div class="paragraph">
      <p class="line">MACKLEY is a middle name.</p>
    </div>
    <div class="paragraph">
      <p class="line">There's you <span class="inside-hover" tabindex="0">inside</span>-</p>
    </div>
    <div class="paragraph">
      <p class="line">And you <span class="outside-hover" tabindex="0">outside</span>.</p>
    </div>
    <div class="paragraph">
      <p class="line">Close the gap.</p>
    </div>
    <div class="snap-spacer" aria-hidden="true"></div>
  </main>

  <footer class="site-footer">
    <span>@MACKLEY 2026</span>
    <span>Original Neti Pot</span>
    <span>Legal</span>
  </footer>

  <script>
    const narrative = document.getElementById("narrative");
    const header = document.querySelector(".site-header");
    const footer = document.querySelector(".site-footer");
    const paragraphs = Array.from(document.querySelectorAll(".paragraph"));
    const bgLayer = document.getElementById("bg-layer");
    const insideTargets = document.querySelectorAll(".inside-hover");
    const outsideTargets = document.querySelectorAll(".outside-hover");

    const insideGifs = [
      "/public/inside/lightning.gif",
      "/public/inside/candle.gif",
      "/public/inside/chamber.gif",
      "/public/inside/compass.gif",
      "/public/inside/door.gif",
      "/public/inside/ember.gif",
      "/public/inside/heart.gif",
      "/public/inside/storm.gif",
      "/public/inside/vortex.gif",
      "/public/inside/water.gif"
    ];

    const outsideGifs = [
      "/public/outside/astronaut.gif",
      "/public/outside/cowgirl.gif",
      "/public/outside/diver.gif",
      "/public/outside/fighter.gif",
      "/public/outside/jogger.gif",
      "/public/outside/slackliner.gif",
      "/public/outside/sufi.gif",
      "/public/outside/surfer.gif",
      "/public/outside/yogi.gif"
    ];

    let gifTimer = null;
    let currentPool = null;
    const poolQueues = new Map();

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function resetQueue(pool) {
      if (!pool) return;
      poolQueues.set(pool, []);
    }

    function nextFromPool(pool) {
      let queue = poolQueues.get(pool);
      if (!queue || queue.length === 0) {
        queue = shuffle([...pool]);
        poolQueues.set(pool, queue);
      }
      return queue.shift();
    }

    function setGif(pool) {
      const next = nextFromPool(pool);
      const cacheBust = `${next}?t=${Date.now()}`;
      bgLayer.style.backgroundImage = `url(${cacheBust})`;
      bgLayer.classList.add("active");
    }

    function scheduleNextGif() {
      if (!currentPool) return;
      setGif(currentPool);
      gifTimer = window.setTimeout(scheduleNextGif, 3400);
    }

    function startGifLoop(pool) {
      if (currentPool !== pool) {
        stopGifLoop();
        currentPool = pool;
        resetQueue(pool);
      }
      if (gifTimer) return;
      scheduleNextGif();
    }

    function stopGifLoop() {
      if (gifTimer) {
        window.clearTimeout(gifTimer);
        gifTimer = null;
      }
      resetQueue(currentPool);
      currentPool = null;
      bgLayer.classList.remove("active");
      bgLayer.style.backgroundImage = "none";
    }

    insideTargets.forEach((el) => {
      el.addEventListener("mouseenter", () => startGifLoop(insideGifs));
      el.addEventListener("mouseleave", stopGifLoop);
      el.addEventListener("focus", () => startGifLoop(insideGifs));
      el.addEventListener("blur", stopGifLoop);
      el.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") {
          startGifLoop(insideGifs);
        }
      });
      el.addEventListener("pointerup", (event) => {
        if (event.pointerType === "touch") {
          stopGifLoop();
        }
      });
      el.addEventListener("pointercancel", stopGifLoop);
    });

    outsideTargets.forEach((el) => {
      el.addEventListener("mouseenter", () => startGifLoop(outsideGifs));
      el.addEventListener("mouseleave", stopGifLoop);
      el.addEventListener("focus", () => startGifLoop(outsideGifs));
      el.addEventListener("blur", stopGifLoop);
      el.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") {
          startGifLoop(outsideGifs);
        }
      });
      el.addEventListener("pointerup", (event) => {
        if (event.pointerType === "touch") {
          stopGifLoop();
        }
      });
      el.addEventListener("pointercancel", stopGifLoop);
    });

    function updateInsets() {
      const root = document.documentElement;
      const headerHeight = header ? header.offsetHeight : 0;
      const footerHeight = footer ? footer.offsetHeight : 0;
      root.style.setProperty("--header-h", `${headerHeight}px`);
      root.style.setProperty("--footer-h", `${footerHeight}px`);
    }

    function opacityForDistance(distance, step) {
      const t = distance / Math.max(step, 1);
      const floor = 0.02;
      const k = 2.3;
      return Math.max(floor, Math.exp(-k * t));
    }

    function updateOpacity() {
      const centerY = window.innerHeight / 2;
      const step = paragraphs[0] ? paragraphs[0].getBoundingClientRect().height : 1;

      paragraphs.forEach((paragraph) => {
        const rect = paragraph.getBoundingClientRect();
        const paragraphCenter = rect.top + rect.height / 2;
        const distance = Math.abs(paragraphCenter - centerY);
        const opacity = opacityForDistance(distance, step);
        paragraph.style.opacity = opacity.toFixed(3);
        paragraph.classList.remove("active");
      });

      let closest = null;
      let closestDistance = Infinity;
      paragraphs.forEach((paragraph) => {
        const rect = paragraph.getBoundingClientRect();
        const paragraphCenter = rect.top + rect.height / 2;
        const distance = Math.abs(paragraphCenter - centerY);
        if (distance < closestDistance) {
          closestDistance = distance;
          closest = paragraph;
        }
      });

      if (closest) {
        closest.classList.add("active");
        closest.style.opacity = "1";
      }
    }

    function fitLineToContainer(line) {
      const container = line.parentElement;
      if (!container) return;
      const styles = window.getComputedStyle(container);
      const paddingLeft = parseFloat(styles.paddingLeft) || 0;
      const paddingRight = parseFloat(styles.paddingRight) || 0;
      const maxFontSize = 72;
      const minFontSize = 18;
      const availableWidth = Math.max(0, container.clientWidth - paddingLeft - paddingRight);

      let size = maxFontSize;
      line.style.fontSize = `${size}px`;

      while (line.scrollWidth > availableWidth && size > minFontSize) {
        size -= 1;
        line.style.fontSize = `${size}px`;
      }
    }

    function fitAllLines() {
      document.querySelectorAll(".line").forEach(fitLineToContainer);
    }

    function centerFirstParagraph() {
      if (!paragraphs[0]) return;
      const first = paragraphs[0];
      const target = first.offsetTop - (narrative.clientHeight / 2 - first.clientHeight / 2);
      narrative.scrollTop = Math.max(target, 0);
    }

    let scrollTicking = false;
    function onScroll() {
      if (scrollTicking) return;
      scrollTicking = true;
      window.requestAnimationFrame(() => {
        updateOpacity();
        scrollTicking = false;
      });
    }

    fitAllLines();
    updateInsets();
    centerFirstParagraph();
    updateOpacity();

    window.addEventListener("resize", () => {
      updateInsets();
      updateOpacity();
      requestAnimationFrame(fitAllLines);
    });

    narrative.addEventListener("scroll", onScroll);
  </script>
</body>
</html>
