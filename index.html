<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mackley — Breathe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons (dark / light variants) -->
  <link rel="icon" type="image/png" href="images/icon_dark.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="images/icon_light.png" media="(prefers-color-scheme: dark)">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --dot-size-min: 40px;
      --dot-size-max: 80px;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, -webkit-system-font,
        "Segoe UI", sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* full-screen background that swaps images */
    .hero {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 0;
      pointer-events: none;
    }

    .hero.show {
      opacity: 1;
    }

    /* shell for centering content + pinning footer */
    .shell {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 16px 16px;
      width: 100%;
    }

    /* main center stack: dot + text */
    .scene {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    /* the dot button */
    .dot-button {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      outline: none;
    }

    .dot {
      width: clamp(var(--dot-size-min), 10vw, var(--dot-size-max));
      height: clamp(var(--dot-size-min), 10vw, var(--dot-size-max));
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      box-shadow: 0 0 0 rgba(255, 255, 255, 0);
      transition:
        background-color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
    }

    .dot-symbol {
      font-size: clamp(18px, 4vw, 28px);
      line-height: 1;
      color: #ffffff;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    /* hover state (triggered via JS on dot or label hover) */
    body.hovering-control .dot {
      background-color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.85);
      transform: scale(1.04);
    }

    body.hovering-control .dot-symbol {
      color: #000000;
      transform: scale(1.05);
    }

    /* label under the dot */
    .label-link {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      position: relative;
      padding-bottom: 2px;
    }

    .label-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background-color: #ffffff;
      transition: width 0.16s ease-out;
    }

    .label-link:hover::after,
    .label-link:focus-visible::after {
      width: 100%;
    }

    /* message text: ● breathe ∞ potential */
    .message {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .message span.symbol {
      font-size: 14px;
      vertical-align: middle;
    }

    /* footer pinned to bottom */
    .footer {
      width: 100%;
      text-align: center;
      padding: 12px 16px 20px;
      font-size: 11px;
      color: #ffffff;
    }

    .footer-link {
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .footer-link:hover,
    .footer-link:focus-visible {
      text-decoration: underline;
    }

    /* small screens */
    @media (max-width: 600px) {
      .shell {
        padding-top: 32px;
      }

      .message {
        margin-top: 14px;
        font-size: 11px;
      }

      .footer {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- background layer -->
  <div class="hero"></div>

  <!-- foreground content -->
  <div class="shell">
    <main class="scene">
      <button class="dot-button" aria-label="Toggle breathe / potential">
        <span class="dot">
          <span class="dot-symbol">●</span>
        </span>
      </button>

      <!-- product link (text changes, href stays product page) -->
      <a href="/clear" class="label-link" id="label-text">breathe</a>

      <div class="message">
        <span class="symbol">●</span> breathe
        &nbsp;&nbsp;
        <span class="symbol">∞</span> potential
      </div>
    </main>

    <footer class="footer">
      <a href="/clear" class="footer-link">original neti pot</a>
    </footer>
  </div>

  <script>
    const images = [
      "images/fight.png",
      "images/run.png",
      "images/dive.png",
      "images/surf.png"
    ];

    const hero = document.querySelector(".hero");
    const dotButton = document.querySelector(".dot-button");
    const dotSymbol = document.querySelector(".dot-symbol");
    const labelLink = document.getElementById("label-text");

    let currentImageIndex = -1;
    let currentMode = "breathe"; // or "potential"

    function setRandomBackground() {
      if (!images.length) return;

      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * images.length);
      } while (images.length > 1 && nextIndex === currentImageIndex);

      currentImageIndex = nextIndex;
      hero.style.backgroundImage = `url("${images[currentImageIndex]}")`;
      hero.classList.add("show");
    }

    function clearBackground() {
      hero.classList.remove("show");
    }

    function handleHoverEnter() {
      document.body.classList.add("hovering-control");
      setRandomBackground();
    }

    function handleHoverLeave() {
      document.body.classList.remove("hovering-control");
      clearBackground();
    }

    // hover effects from dot OR label
    dotButton.addEventListener("mouseenter", handleHoverEnter);
    dotButton.addEventListener("mouseleave", handleHoverLeave);
    labelLink.addEventListener("mouseenter", handleHoverEnter);
    labelLink.addEventListener("mouseleave", handleHoverLeave);

    // tap / click on the dot toggles state between breathe / potential
    dotButton.addEventListener("click", () => {
      if (currentMode === "breathe") {
        currentMode = "potential";
        dotSymbol.textContent = "∞";
        labelLink.textContent = "potential";
      } else {
        currentMode = "breathe";
        dotSymbol.textContent = "●";
        labelLink.textContent = "breathe";
      }
    });

    // basic touch support: trigger hover effect on touchstart, end on touchend
    dotButton.addEventListener("touchstart", (e) => {
      e.preventDefault();
      handleHoverEnter();
    }, { passive: false });

    dotButton.addEventListener("touchend", () => {
      handleHoverLeave();
    });

    labelLink.addEventListener("touchstart", (e) => {
      // allow navigation but still do the hover effect momentarily
      handleHoverEnter();
    }, { passive: true });

    labelLink.addEventListener("touchend", () => {
      handleHoverLeave();
    });
  </script>
</body>
</html>
