<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mackley</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="images/icon_dark.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="images/icon_light.png" media="(prefers-color-scheme: dark)">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    /* Fullscreen background image layer */
    .hero {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.7s ease;
      z-index: 0;
      pointer-events: none;
    }

    .hero.show {
      opacity: 1;
    }

    /* Centered main content */
    .main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
    }

    .orb-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .orb {
      width: clamp(56px, 7.5vw, 80px);
      height: clamp(56px, 7.5vw, 80px);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 0 rgba(255, 255, 255, 0);
      transition:
        background 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease,
        border-color 0.35s ease;
    }

    .orb-icon {
      font-size: 22px;
      color: #ffffff;
      transition: color 0.35s ease;
      line-height: 1;
    }

    .orb-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      transition: color 0.35s ease;
    }

    /* Hover state — fill white, icon & label go black */
    .orb-wrapper:hover .orb,
    .orb-wrapper.activated .orb {
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 26px rgba(255, 255, 255, 0.75);
      transform: translateY(-1px) scale(1.02);
    }

    .orb-wrapper:hover .orb-icon,
    .orb-wrapper.activated .orb-icon {
      color: #000000;
    }

    .orb-wrapper:hover .orb-label,
    .orb-wrapper.activated .orb-label {
      color: #000000;
    }

    /* Footer */
    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      z-index: 2;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.75),
        rgba(0, 0, 0, 0)
      );
      padding: 18px 24px 10px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .footer-logo {
      height: 16px;
      width: auto;
      display: block;
    }

    .footer-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 10px;
    }

    .footer-nav a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
    }

    .footer-nav a:hover {
      text-decoration: underline;
    }

    .footer-dot {
      opacity: 0.6;
    }

    .footer-meta {
      display: flex;
      gap: 10px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.65);
    }

    .footer-meta a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
    }

    .footer-meta a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .footer {
        padding: 14px 14px 8px;
      }

      .footer-inner {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <!-- Background image layer -->
  <div class="hero"></div>

  <!-- Centered circle + text -->
  <main class="main">
    <div class="orb-wrapper">
      <button class="orb" type="button" aria-label="Breathe">
        <span class="orb-icon">●</span>
      </button>
      <!-- Both states link to product page -->
      <a href="/original-neti-pot" class="orb-label">Breathe</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <img src="images/logo_light.png" alt="Mackley" class="footer-logo" />
      <nav class="footer-nav">
        <a href="/original-neti-pot">Original Neti Pot</a>
        <span class="footer-dot">·</span>
        <a href="/contact">Contact</a>
      </nav>
    </div>
    <div class="footer-meta">
      <span>© 2025 Mackley</span>
      <a href="/legal">Legal</a>
    </div>
  </footer>

  <script>
    const hero = document.querySelector('.hero');
    const orbWrapper = document.querySelector('.orb-wrapper');
    const orb = document.querySelector('.orb');
    const orbIcon = document.querySelector('.orb-icon');
    const orbLabel = document.querySelector('.orb-label');

    const images = [
      'images/fight.png',
      'images/run.png',
      'images/dive.png',
      'images/surf.png'
    ];

    let isActivated = false;

    function setRandomBackground() {
      const img = images[Math.floor(Math.random() * images.length)];
      hero.style.backgroundImage = `url('${img}')`;
    }

    // Hover: random background, fade in
    orbWrapper.addEventListener('mouseenter', () => {
      setRandomBackground();
      hero.classList.add('show');
    });

    // Leave: if not activated, fade back to black
    orbWrapper.addEventListener('mouseleave', () => {
      if (!isActivated) {
        hero.classList.remove('show');
        hero.style.backgroundImage = 'none';
      }
    });

    // Click the circle: toggle between ● Breathe and ∞ Potential
    orb.addEventListener('click', (event) => {
      event.preventDefault();

      isActivated = !isActivated;

      if (isActivated) {
        // Lock in "∞ potential" state
        orbWrapper.classList.add('activated');
        orbIcon.textContent = '∞';
        orb.setAttribute('aria-label', 'Potential');
        orbLabel.textContent = 'Potential';

        if (!hero.style.backgroundImage || hero.style.backgroundImage === 'none') {
          setRandomBackground();
        }
        hero.classList.add('show');
      } else {
        // Return to base "● breathe" state
        orbWrapper.classList.remove('activated');
        orbIcon.textContent = '●';
        orb.setAttribute('aria-label', 'Breathe');
        orbLabel.textContent = 'Breathe';

        hero.classList.remove('show');
        hero.style.backgroundImage = 'none';
      }
    });
  </script>
</body>
</html>
