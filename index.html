<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mackley</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Favicons -->
<link rel="icon" type="image/png" href="images/icon_dark.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="images/icon_light.png" media="(prefers-color-scheme: light)">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  /* BACKGROUND IMAGE */
  .hero {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity .5s ease;
    pointer-events: none;
  }
  .hero.show { opacity: 1; }

  /* CENTER WRAPPER */
  .center-wrap {
    height: 100vh;
    width: 100vw;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    z-index:3;
  }

  /* DOT BUTTON */
  .dot-btn {
    width:70px;
    height:70px;
    border-radius:50%;
    border:2px solid #fff;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition: all .3s ease;
    position:relative;
  }

  .dot-inner {
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    transition: all .3s ease;
  }

  .label {
    margin-top:10px;
    font-size:14px;
    letter-spacing:0.06em;
    text-align:center;
    transition: color .3s ease;
  }

  /* HOVER STATE — PREVIEW */
  .dot-btn:hover {
    background:#fff;
    border-color:#fff;
  }
  .dot-btn:hover .dot-inner {
    transform:scale(0);
  }

  .dot-btn.hover-mode .dot-inner {
    transform:scale(0);
  }

  /* WHEN DOT IS “∞ MODE” */
  .dot-btn.infinity {
    background:#fff;
    border-color:#fff;
  }
  .dot-btn.infinity .dot-inner {
    display:none;
  }
  .infinity-symbol {
    font-size:26px;
    font-weight:600;
    color:#000; /* BLACK ON IMAGE STATE */
    opacity: 0;
    transition: opacity .3s ease;
  }
  .dot-btn.infinity .infinity-symbol {
    opacity:1;
  }

  .label.infinity {
    color:#000; /* BLACK LABEL ON IMAGE STATE */
  }

  /* FOOTER */
  footer {
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    padding:28px 0 16px;
    z-index:5;
    background: linear-gradient(to top, rgba(0,0,0,0.45), rgba(0,0,0,0));
  }

  footer img {
    height:13px;
    vertical-align:middle;
    margin-right:10px;
    opacity:.9;
  }

  footer a {
    color:#fff;
    font-size:12px;
    text-decoration:none;
    letter-spacing:0.08em;
  }
  footer a:hover {
    text-decoration:underline;
  }

  .copyright {
    margin-top:6px;
    font-size:10px;
    opacity:.55;
  }
</style>
</head>

<body>

<div class="hero" id="hero"></div>

<div class="center-wrap">

  <!-- DOT -->
  <div class="dot-btn" id="dot">
    <div class="dot-inner"></div>
    <div class="infinity-symbol">∞</div>
  </div>

  <div class="label" id="label">BREATHE</div>

</div>

<!-- FOOTER -->
<footer>
  <img src="images/logo_light.png" alt="Mackley">
  <a href="/product">THE ORIGINAL NETI POT</a> · 
  <a href="/contact">CONTACT</a>
  <div class="copyright">© 2025 Mackley &nbsp; <a href="/legal">Legal</a></div>
</footer>

<script>
const hero = document.getElementById("hero");
const dot = document.getElementById("dot");
const label = document.getElementById("label");

const images = [
  "images/fight.png",
  "images/run.png",
  "images/dive.png",
  "images/surf.png"
];

let isInfinity = false;

/* HOVER PREVIEW */
dot.addEventListener("mouseenter", () => {
  if (!isInfinity) {
    const img = images[Math.floor(Math.random()*images.length)];
    hero.style.backgroundImage = `url('${img}')`;
    hero.classList.add("show");
  }
});

dot.addEventListener("mouseleave", () => {
  if (!isInfinity) {
    hero.classList.remove("show");
  }
});

/* CLICK — SWITCH TO ∞ MODE */
dot.addEventListener("click", () => {
  isInfinity = true;

  dot.classList.add("infinity");
  label.classList.add("infinity");

  label.textContent = "POTENTIAL";

  // show background persistently
  const img = images[Math.floor(Math.random()*images.length)];
  hero.style.backgroundImage = `url('${img}')`;
  hero.classList.add("show");
});

/* CLICK TO GO TO PRODUCT PAGE */
label.addEventListener("click", () => {
  window.location.href = "/product";
});
dot.addEventListener("click", () => {
  if (isInfinity) window.location.href = "/product";
});
</script>

</body>
</html>
