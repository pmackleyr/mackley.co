<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mackley</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicons -->
  <link rel="icon" href="images/icon_dark.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="images/icon_light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="images/icon_dark.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
    }

    .main {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* fullscreen background image */
    .hero {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.7s ease;
      z-index: 0;
      pointer-events: none;
    }

    .hero.show {
      opacity: 1;
    }

    /* center stack: dot + BREATHE */
    .prompt {
      flex: 1;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: clamp(24px, 4vw, 40px);
      text-align: center;
    }

    .dot-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(40px, 7vw, 72px);
      height: clamp(40px, 7vw, 72px);
      border-radius: 999px;
      border: 2px solid #ffffff;
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
      font-size: clamp(20px, 3vw, 30px);
      cursor: pointer;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.9),
        0 0 0 rgba(255, 255, 255, 0);
      transition:
        transform 0.35s ease,
        box-shadow 0.35s ease,
        background 0.35s ease;
    }

    .dot-button:hover,
    .dot-button:focus-visible {
      transform: translateY(-4px) scale(1.05);
      background: rgba(255, 255, 255, 0.08);
      box-shadow:
        0 26px 70px rgba(0, 0, 0, 1),
        0 0 26px rgba(255, 255, 255, 0.28);
      outline: none;
    }

    .dot-button:active {
      transform: translateY(0) scale(0.97);
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.75),
        0 0 10px rgba(255, 255, 255, 0.18);
    }

    .breathe-label {
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.26em;
      font-size: 0.78rem;
      color: #ffffff;
    }

    .breathe-label:hover {
      text-decoration: underline;
    }

    /* footer pinned to bottom */
    .footer {
      position: relative;
      z-index: 1;
      padding: 14px clamp(18px, 4vw, 40px) 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #ffffff;
    }

    .footer-inner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-logo {
      height: 18px;
      width: auto;
      display: block;
    }

    .footer-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .footer-nav a {
      color: #ffffff;
      text-decoration: none;
    }

    .footer-nav a:hover {
      text-decoration: underline;
    }

    .footer-divider {
      opacity: 0.7;
    }

    .footer-meta {
      font-size: 0.65rem;
      color: #777777;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    .footer-meta a {
      color: #999999;
      text-decoration: none;
    }

    .footer-meta a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .footer-inner {
        flex-direction: column;
        gap: 10px;
      }

      .footer-nav {
        font-size: 0.68rem;
        letter-spacing: 0.18em;
      }

      .breathe-label {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <main class="main">
    <div class="hero" aria-hidden="true"></div>

    <section class="prompt" aria-label="Breathe entry">
      <button
        class="dot-button"
        type="button"
        aria-label="Change background image"
      >
        ●
      </button>
      <a class="breathe-label" href="/clear">BREATHE</a>
    </section>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <img
            src="images/logo_light.png"
            alt="Mackley"
            class="footer-logo"
          />
        </div>
        <nav class="footer-nav" aria-label="Footer navigation">
          <a href="/clear">BREATHE</a>
          <span class="footer-divider">•</span>
          <a href="/contact">CONTACT</a>
        </nav>
      </div>
      <div class="footer-meta">
        <span>© 2025 Mackley</span>
        <a href="/legal">Legal</a>
      </div>
    </footer>
  </main>

  <script>
    const hero = document.querySelector(".hero");
    const dotButton = document.querySelector(".dot-button");

    const images = [
      "images/fight.png",
      "images/run.png",
      "images/dive.png",
      "images/surf.png"
    ];

    let currentIndex = -1;

    function setRandomBackground() {
      if (!hero) return;

      let nextIndex;
      if (images.length === 0) return;

      do {
        nextIndex = Math.floor(Math.random() * images.length);
      } while (images.length > 1 && nextIndex === currentIndex);

      currentIndex = nextIndex;
      hero.style.backgroundImage = `url('${images[currentIndex]}')`;
      hero.classList.add("show");
    }

    if (dotButton) {
      dotButton.addEventListener("click", setRandomBackground);
    }
  </script>
</body>
</html>
