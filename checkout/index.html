<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Checkout | MACKLEY</title>
  <meta name="stripe-payment-link" content="https://buy.stripe.com/5kQ4gzeDn2oq0qg2Yadwc00" />
  <script>
    const stripeLink = document.querySelector("meta[name=\"stripe-payment-link\"]")?.content;
    const accessKey = "mackley-site-access-v1";
    const accessHash = "102d3e336bf22875508dfc94e8d703c21589db448a4b4ba2f0c4838d2cb97e68";
    const hasAccess = () => {
      try {
        return window.sessionStorage.getItem(accessKey) === accessHash;
      } catch (error) {
        return false;
      }
    };
    const redirectToStripe = () => {
      if (!stripeLink || !hasAccess()) return;
      window.location.replace(stripeLink);
    };
    redirectToStripe();
    window.addEventListener("mackley:unlocked", redirectToStripe, { once: true });
  </script>
